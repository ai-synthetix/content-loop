apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-loop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: content-loop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: content-loop-api
                port:
                  number: 80
  tls:
    - hosts: ["content-loop.example.com"]
      secretName: content-loop-tls
