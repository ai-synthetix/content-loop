services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-contentloop}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-content_loop}
      MYSQL_USER: ${MYSQL_USER:-contentloop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-contentloop}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-contentloop}"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-contentloop:contentloop@tcp(mysql:3306)/content_loop?parseTime=true&multiStatements=true&charset=utf8mb4}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-for-local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CHANNEL_ENCRYPTION_KEY: ${CHANNEL_ENCRYPTION_KEY:-dev-32-byte-key-for-tests-123456}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-kimi-k2.5}
    ports:
      - "${HOST_PORT:-8081}:${PORT:-8080}"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mysql_data:
